[project]
name = "saas-revenue-pipeline"
version = "0.1.0"
description = "SaaS revenue fundamentals pipeline built on SEC EDGAR XBRL data"
readme = "README.md"
authors = [
    { name = "Abdul Rauf Maroof", email = "abdulrauf96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
saasrev = "saas_revenue_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
